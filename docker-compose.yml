services:
  # בסיס הנתונים PostgreSQL
  db:
    image: postgres:latest
    container_name: my_postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - mydbdata:/var/lib/postgresql

  # ממשק הניהול pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: trevitz@g.jct.ac.il
      PGADMIN_DEFAULT_PASSWORD: trevitz123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  mydbdata: